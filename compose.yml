services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - ANEMOCHORE_API_URL
      - ANEMOCHORE_API_KEY
      - XYLEM_DELETE_SECRET
      - XYLEM_STATIC_DIR
      - BINDING
      - PORT
    command: npm run dev

volumes:
  node_modules:
