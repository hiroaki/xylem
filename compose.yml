services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      ANEMOCHORE_API_URL: ${ANEMOCHORE_API_URL}
      ANEMOCHORE_API_KEY: ${ANEMOCHORE_API_KEY}
      XYLEM_PUBLIC_ORIGIN: ${XYLEM_PUBLIC_ORIGIN}
      XYLEM_DELETE_SECRET: ${XYLEM_DELETE_SECRET}
      VIEWER_URL_TEMPLATE: ${VIEWER_URL_TEMPLATE}
      BINDING: ${BINDING}
      PORT: ${PORT}
    command: npm run dev

volumes:
  node_modules:
